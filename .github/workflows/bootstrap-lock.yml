name: Bootstrap dependency lock

on:
  push:
    branches: [oc-pc2-103-reproducible-lockfile]

permissions:
  contents: write

jobs:
  generate-lock:
    if: ${{ !contains(github.event.head_commit.message, '[lock-bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: oc-pc2-103-reproducible-lockfile
          persist-credentials: true
      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Generate reviewed lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify security/runtime pins in lockfile
        run: |
          node - <<'NODE'
          const lock=require('./package-lock.json');
          const required={
            'node_modules/next':'16.4.1',
            'node_modules/react':'19.2.8',
            'node_modules/react-dom':'19.2.8',
            'node_modules/framer-motion':'12.23.25',
            'node_modules/motion-dom':'12.40.0',
            'node_modules/motion-utils':'12.39.0'
          };
          for(const [path,version] of Object.entries(required)){
            if(lock.packages?.[path]?.version!==version)throw new Error(`${path} resolved ${lock.packages?.[path]?.version}, expected ${version}`);
          }
          if(lock.lockfileVersion!==3)throw new Error(`Unexpected lockfileVersion ${lock.lockfileVersion}`);
          NODE
      - name: Commit generated lockfile to bootstrap branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: commit generated npm lockfile [lock-bootstrap]"
          git push origin HEAD:oc-pc2-103-reproducible-lockfile
